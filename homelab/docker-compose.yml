services:
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: homelab-docker-socket-proxy
    environment:
      CONTAINERS: 1
      IMAGES: 1
      NETWORKS: 1
      VOLUMES: 1
      INFO: 1
      PING: 1
      VERSION: 1
      POST: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - homelab-internal
    restart: unless-stopped

  portainer:
    image: portainer/portainer-ce:latest
    container_name: homelab-portainer
    command: ["-H", "tcp://docker-socket-proxy:2375"]
    ports:
      - "127.0.0.1:${PORTAINER_PORT:-9000}:9000"
      - "${TAILSCALE_HOST}:${PORTAINER_PORT:-9000}:9000"
    volumes:
      - portainer-data:/data
    networks:
      - homelab-internal
    depends_on:
      - docker-socket-proxy
    restart: unless-stopped

  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homelab-homepage
    ports:
      - "127.0.0.1:${HOMEPAGE_PORT:-3000}:3000"
      - "${TAILSCALE_HOST}:${HOMEPAGE_PORT:-3000}:3000"
    environment:
      HOMEPAGE_VAR_TAILSCALE_HOST: ${TAILSCALE_HOST}
      HOMEPAGE_VAR_PORTAINER_PORT: ${PORTAINER_PORT:-9000}
    volumes:
      - ./homepage-config:/app/config
      - ./homepage-icons:/app/public/icons
    networks:
      - homelab-internal
    depends_on:
      - docker-socket-proxy
    restart: unless-stopped

networks:
  homelab-internal:
    driver: bridge

volumes:
  portainer-data:
